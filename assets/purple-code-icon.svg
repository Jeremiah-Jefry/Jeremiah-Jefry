<svg width="50" height="50" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="50%" stop-color="#B24BF3"/>
      <stop offset="100%" stop-color="#E8D5F5"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(25,25)" filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="6s" repeatCount="indefinite" additive="sum"/>
    <!-- Outer diamond -->
    <rect x="-14" y="-14" width="28" height="28" rx="4" fill="none" stroke="url(#purpleGrad)" stroke-width="2.5" transform="rotate(45)">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </rect>
    <!-- Inner code brackets </> -->
    <text x="0" y="6" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="16" fill="url(#purpleGrad)">
      &lt;/&gt;
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
