<svg width="100%" height="6" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="moving-grad" x1="0%" y1="0%" x2="50%" y2="0%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a0533" stop-opacity="0.2"/>
      <stop offset="30%" stop-color="#9333EA" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#B24BF3" stop-opacity="1"/>
      <stop offset="70%" stop-color="#E8D5F5" stop-opacity="1"/>
      <stop offset="85%" stop-color="#B24BF3" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1a0533" stop-opacity="0.2"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1" to="1" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Glow layer -->
  <rect width="100%" height="6" fill="url(#moving-grad)" rx="3" filter="url(#glow)" opacity="0.6">
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>
  <!-- Main line -->
  <rect width="100%" height="4" y="1" fill="url(#moving-grad)" rx="2">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
